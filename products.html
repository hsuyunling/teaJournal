<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="head-bar.css">
    <script src="loginCondition.js" defer></script>

    <title>Document</title>
    <style>
        @import url('reset.css');
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(240, 240, 240);
        }

        #all-products{
            width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: left;
            gap: 20px;
            padding: 20px;
            list-style: none;
        }

        .product-item{
            background-color: rgba(255, 255, 255, 0.913);
            border: 1px solid rgba(219, 219, 219, 0.726);
            box-shadow: 0 0 10px rgba(145, 145, 145, 0.394);
            border-radius: 15px;
            width: 200px;
            padding: 15px;
            text-align: center;
            position: relative;
            transition: .2s;
        }

        .product-item:hover{
            box-shadow: 0 0 13px rgba(135, 135, 135, 0.394);
            background-color: #0f70108e;
            transform: scale(0.85) translateY(25px);
            cursor: pointer;

            position: relative;
        }
        
        .product-item:hover p, .product-item:hover h2, .product-item:hover h3{
            color: white;

        }

        .product-item:hover::before{
            content: '按一下加入購物車';
            line-height: 35px;
            font-size: 17px;

            width: 220px;
            height: 35px;
            /* background-color: aquamarine; */
            position: absolute;
            top: -50px;
            left: 5px;

            pointer-events: none;
        }


        .product-item img{
            width: 130px;
            margin: 20px 10px 50px;
            height: auto;
            border-radius: 10px;
        }

        .product-item h2{
            font-size: 16px;
        }

        .product-item h3{
            margin: 10px 0;

            font-size: 18px;
            text-align: center;
        }
        .product-item p{
            font-size: 20px;
            font-weight: bold;
            color: rgb(57, 71, 154);
            position: absolute;
            bottom: 30px;
            left: 80px;
            margin-top: 20px;
        }


    </style>
    
</head>
<body>
    <ul class="head-bar">
        <i class="fa-brands fa-envira" style="margin-left: 50px;"></i>
        <a href="index.html" class="logo">茶園日誌</a>
        <li class="dropdown" id="user-menu">
          <a href="login.html" id="user-link">登入</a>
        </li>          
          <li><a href="cart.html">購物車</a></li>
          <li><a href="products.html">產品概覽</a></li>
          <li><a href="aboutuUs.html">關於我們</a></li>
      </ul>
    <ul id="all-products"></ul>

    <script src="products.js"></script>
    <script>
    const container = document.getElementById("all-products");
    

        
        // 初始化 localStorage cart
        function getCart(){
          return JSON.parse(localStorage.getItem("cart")) || [];
        }
        
        function saveCart(cart){
          localStorage.setItem("cart", JSON.stringify(cart));
        }
        
        // 加入購物車
        function addToCart(productId){
          let cart = getCart();
          const found = cart.find(item => item.productId === productId);
        
          if(found){
            found.qty++;
          }else{
            cart.push({ productId, qty: 1 });
          }
        
          saveCart(cart);
          alert("已加入購物車 ✅");
        }
        
        // 渲染所有產品
        products.forEach(p => {
            
          const li = document.createElement("li");
          li.className = "product-item";
          li.innerHTML = `
            <h3>${p.name}</h3>
            <h2>${p.farmer}</h2>
            <img src="${p.img}" alt="">
            <p>＄${p.price}</p>
          `;
        
          // ✅ 點擊商品 → 加入購物車
          li.addEventListener("click", () => {
            console.log("clicked:", p.name);

            addToCart(p.id);
          });
        
          container.appendChild(li);
        });
        </script>
        
        
</body>
</html>
