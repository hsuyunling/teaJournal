<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入揪團</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="container">
        <a href="login.html" class="loginLink"><i class="fa-solid fa-arrow-left"></i> </a>

            <form method="post" action="db.php">

                <h1>註冊</h1>
                <div class="loginArea">
                    <ul>
                        <li>帳號：<input type="text" name="id"></li>
                        <li>電子郵件：<input type="text" name="email"></li>
                        <li>電話號碼：<input type="text" name="phone"></li>
                        <li>姓名：<input type="text" name="name"></li>
                        <li>暱稱：<input type="text" name="nick"></li>
                        <li>密碼：<input type="password" name="psw"></li>
                        <li class="btns"><button type="submit" class="registerBtn">註冊</button>
                        </li>
                    </ul>

                </div>
            </form>

    </div>

    <footer style="height: 150px;"></footer>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginLink = document.querySelector('a[href="login.html"]');
            const cartLink = document.querySelector('a[href="cart.html"]');
        
            // 取得登入狀態（true / false）
            const isLoggedIn = localStorage.getItem("loggedIn") === "true";
        
            // (A) 如果已登入 → 將「登入」改成「個人」
            if (isLoggedIn) {
                loginLink.textContent = "個人";
                loginLink.href = "profile.html"; // demo：跳轉到個人頁
            }
        
            // (B) 如果未登入 → 點購物車時強制導到登入頁
            cartLink.addEventListener("click", (e) => {
                if (!isLoggedIn) {
                    e.preventDefault();
                    window.location.href = "login.html";
                }
            });
        });
    </script>
        
</body>
</html>
